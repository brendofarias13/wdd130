<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>
<body>

    <h1>Questionário de HTML e CSS</h1>

    <form>

        <div class="form-item">
            <label for="q1">1. O que significa a sigla CSS?</label>
            <input type="text" id="q1" name="q1">
        </div>

        <div class="form-item">
            <label for="q2">2. Como os atributos "id" e "class" são selecionados no CSS?</label>
            <textarea id="q2" name="q2"></textarea>
        </div>

        <div class="form-item">
            <label for="q3">3. Qual das opções abaixo é um comentário CSS válido?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Escolha uma...</option>
                <option value="1">// comentário</option>
                <option value="2">/* comentário */</option>
                <option value="3"><!-- comentário --></option>
            </select>
        </div>

        <div class="form-item">
            <label for="q4">4. Qual é a margem inferior dada por esta declaração?</label>

            <div class="codigo">
                margin: 10px 5px 15px;
            </div>

            <input type="number" id="q4" name="q4">
        </div>

        <button type="submit">ENVIAR QUESTIONÁRIO</button>

    </form>

</body>
</html>
